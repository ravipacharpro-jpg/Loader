name: Build Featurestic Loader APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Signed Release APK
        run: |
          if [ -f "settings.gradle" ]; then
            gradle assembleDebug assembleRelease --stacktrace
          elif [ -f "FeaturesticLoader/settings.gradle" ]; then
            cd FeaturesticLoader
            gradle assembleDebug assembleRelease --stacktrace
          fi

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: FeaturesticLoader-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/release/*.apk
